# SPDX-License-Identifier: Apache-2.0
name: Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful MSLd main push run containing the validated package
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated artifact and check release assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # Publisher code comes from main, never from the downloaded artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import checksum signing key
        env:
          MSL_GPG_PRIVATE_KEY: ${{ secrets.MSL_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/msl-gnupg.XXXXXX")
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          if [ -n "$MSL_GPG_PRIVATE_KEY" ]; then
            printf '%s' "$MSL_GPG_PRIVATE_KEY" | gpg --batch --import
          fi
      - name: Publish without rebuilding or changing package metadata
        env:
          MSL_GPG_KEY: ${{ secrets.MSL_GPG_KEY }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            scripts/publish.sh "$BUILD_RUN_ID" --prerelease
          else
            scripts/publish.sh "$BUILD_RUN_ID"
          fi
